    estimated_weeks: 2-3
    tasks_completed: 0
    tasks_total: 6
    notes: |
      Implement comprehensive comment moderation capabilities including reply, 
      delete, hide/unhide, enable/disable, and bulk moderation tools.
  
  - id: M2
