# Dependencies and integrations
dependencies:
  external_services:
    - name: Instagram Graph API
      status: configured
      notes: |
        Access token configured via INSTAGRAM_ACCESS_TOKEN environment variable
    
    - name: Instagram Messaging API
      status: configured
      notes: |
        Uses same access token as Graph API
  
  libraries:
    - name: "@modelcontextprotocol/sdk"
      version: latest
      purpose: |
        MCP protocol implementation
    
    - name: TypeScript
      version: latest
      purpose: |
        Type-safe development
    
    - name: esbuild
      version: latest
      purpose: |
        Fast bundling and compilation
  
  infrastructure:
    - name: Node.js Runtime
      status: ready
      notes: |
        Required for running the MCP server
    
    - name: Git Repository
      status: ready
      notes: |
        Version control and collaboration

