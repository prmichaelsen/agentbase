    completed: null
    estimated_weeks: 2-3
    tasks_completed: 0
    tasks_total: 5
    notes: |
      Implement hashtag search and business discovery features for social listening 
      and competitive analysis.
  
  - id: M3
    name: Advanced Publishing Features
    status: not_started
    progress: 0
    started: null
